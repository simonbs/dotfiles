model = "gpt-5.5"
model_reasoning_effort = "high"
model_context_window = 1000000
model_auto_compact_token_limit = 1000000
service_tier = "default"

personality = "pragmatic"
web_search = "live"

approval_policy = "never"
sandbox_mode = "danger-full-access"
