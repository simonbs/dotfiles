# Share conversation history through a canonical SQLite directory.
sqlite_home = "/Users/simonbs/.codex"

model = "gpt-6.1-sol"
model_reasoning_effort = "medium"
model_context_window = 1000000
model_auto_compact_token_limit = 1000000
service_tier = "default"

approval_policy = "never"
sandbox_mode = "danger-full-access"

notify = ["/Users/simonbs/.codex/computer-use/Codex Computer Use.app/Contents/SharedSupport/SkyComputerUseClient.app/Contents/MacOS/SkyComputerUseClient", "turn-ended"]

[notice]
hide_rate_limit_model_nudge = true
hide_full_access_warning = true

[tui]
status_line = ["model-with-reasoning", "current-dir", "git-branch", "pull-request-number", "context-used", "task-progress"]
status_line_use_colors = true
pet = "disabled"
screen_reader_detection_done = true
theme = "dracula"

[tui.keymap.chat]
skip_question = "ctrl-alt-s"

[tui.model_availability_nux]
"gpt-5.5" = 4
"gpt-5.6-sol" = 4
gpt-6-astra = 4
"gpt-6.1-sol" = 4

[mcp_servers.chrome-devtools]
command = "npx"
args = ["chrome-devtools-mcp@latest"]

[mcp_servers.xcode]
command = "xcrun"
args = ["mcpbridge"]

[mcp_servers.computer-use]
command = "./Codex Computer Use.app/Contents/SharedSupport/SkyComputerUseClient.app/Contents/MacOS/SkyComputerUseClient"
args = ["mcp"]
cwd = "."
enabled = false

[mcp_servers.node_repl]
args = []
command = "/Applications/ChatGPT.app/Contents/Resources/cua_node/bin/node_repl"
startup_timeout_sec = 120

[mcp_servers.node_repl.env]
NODE_REPL_NATIVE_PIPE_CONNECT_TIMEOUT_MS = "1000"
NODE_REPL_NODE_MODULE_DIRS = "/Applications/ChatGPT.app/Contents/Resources/cua_node/lib/node_modules"
NODE_REPL_NODE_PATH = "/Applications/ChatGPT.app/Contents/Resources/cua_node/bin/node"
NODE_REPL_TRUSTED_CODE_PATHS = "/Users/simonbs/.codex:/Applications/ChatGPT.app/Contents/Resources/cua_node/lib/node_modules"
CODEX_HOME = "/Users/simonbs/.codex"
BROWSER_USE_AVAILABLE_BACKENDS = "chrome,iab,mcpapps"
BROWSER_USE_TINYSKY_ENABLED = "1"
NODE_REPL_INSTRUCTIONS_USE_CASE_BROWSER = ""
NODE_REPL_INSTRUCTIONS_USE_CASE_CHROME = ""
NODE_REPL_INSTRUCTIONS_USE_CASE_COMPUTER_USE = ""
BROWSER_USE_CODEX_APP_BUILD_FLAVOR = "prod"
BROWSER_USE_CODEX_APP_VERSION = "26.928.31416"
NODE_REPL_TRUSTED_SERVICES = '{"browser":"/Users/simonbs/.codex/plugins/cache/openai-bundled/browser/26.928.31416/scripts/browser-service.mjs","sky":"@oai/sky/service"}'
SKY_CUA_SERVICE_PATH = "/Users/simonbs/.codex/computer-use/Codex Computer Use.app"
CODEX_CLI_PATH = "/Applications/ChatGPT.app/Contents/Resources/codex-cli/CodexCLI.app/Contents/MacOS/codex"

[desktop]
appearanceTheme = "system"
appearanceDarkCodeThemeId = "dracula"
sansFontSize = 15
codeFontSize = 15

localeOverride = "en-US"
mac-menu-bar-enabled = false
preventSleepWhileRunning = true
keepRemoteControlAwakeWhilePluggedIn = true
show-context-window-usage = true

git-show-sidebar-pr-icons = true
git-create-pull-request-as-draft = false
followUpQueueMode = "queue"
conversationDetailMode = "STEPS_PROSE"
toys-confetti-enabled = true
confirm-before-close = "never"
ambient-suggestions-enabled = true
notifications-sound = "none"

[desktop.open-in-target-preferences]
global = "systemDefault"

[desktop.appearanceDarkChromeTheme]
accent = "#ff79c6"
contrast = 60
ink = "#f8f8f2"
opaqueWindows = false
surface = "#282a36"

[desktop.appearanceDarkChromeTheme.fonts]
code = "FiraCode-Retina"

[desktop.appearanceDarkChromeTheme.semanticColors]
diffAdded = "#50fa7b"
diffRemoved = "#ff5555"
skill = "#ff79c6"

[plugins."browser@openai-bundled"]
enabled = true

[plugins."computer-use@openai-bundled"]
enabled = true

[plugins."documents@openai-primary-runtime"]
enabled = true

[plugins."pdf@openai-primary-runtime"]
enabled = true

[plugins."spreadsheets@openai-primary-runtime"]
enabled = true

[plugins."presentations@openai-primary-runtime"]
enabled = true

[plugins."template-creator@openai-primary-runtime"]
enabled = true

[plugins."codex-app-tools@openai-bundled"]
enabled = true

[plugins."visualize@openai-bundled"]
enabled = true

[plugins."unified-computer-use@openai-bundled"]
enabled = true

[plugins."code-review@openai-bundled"]
enabled = true

[plugins."sbs-dev@sbs"]
enabled = true

[plugins."sbs-utils@sbs"]
enabled = true

[plugins."sbs-news@sbs"]
enabled = true

[marketplaces.openai-bundled]
source_type = "local"
source = "/Users/simonbs/.codex/.tmp/bundled-marketplaces/openai-bundled"

[marketplaces.openai-primary-runtime]
source_type = "local"
source = "/Users/simonbs/.cache/codex-runtimes/codex-primary-runtime/plugins/openai-primary-runtime"

[marketplaces.sbs]
source_type = "git"
source = "https://github.com/simonbs/agent-plugin-marketplace.git"
ref = "main"
